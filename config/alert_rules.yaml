alerts:
  - name: HighLatencyP95
    severity: warning
    condition: p95_latency_ms > 3000
    duration: 5m
    type: symptom-based
    channel: slack
    owner: devops-team
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: critical
    condition: error_rate_pct > 2
    duration: 3m
    type: symptom-based
    channel: slack
    owner: backend-team
    runbook: docs/alerts.md#alert-2
  - name: RetrievalFailureRate
    severity: warning
    condition: retrieval_success_rate_pct < 90
    duration: 5m
    type: symptom-based
    channel: slack
    owner: ai-team
    runbook: docs/alerts.md#alert-3

